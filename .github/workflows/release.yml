name: Release

# 打 tag（v*）时自动构建三平台产物 + Windows 安装包，并上传到对应的 Release，
# 最后把同一批产物镜像到 Gitee（需要配置 GITEE_TOKEN，没配就跳过这一步）；
# 也可以在 Actions 页面手动触发一次，用于验证流水线本身。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      gitee_tag:
        description: '只补发 Gitee 镜像：填一个已发布的 tag（如 v0.4.0）；留空则走完整流程'
        required: false
        type: string

permissions:
  contents: write

jobs:
  desktop:
    name: Windows 与 Linux 产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      # 直接复用仓库脚本，保证本地与 CI 的构建方式完全一致。
      - name: 构建 Windows 可执行文件
        run: bash app/scripts/build-windows.sh

      - name: 构建 Linux 单文件（amd64 / arm64）
        run: bash app/scripts/build-linux.sh

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" != "push" || -z "${tag}" ]]; then
            echo "非 tag 触发，跳过 Release 上传，仅保留构建产物。"
            exit 0
          fi
          # desktop 与 android 两个 job 并行，会同时走到这里；创建失败（对方已创建）
          # 不算错误，继续上传即可。
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "GoStudy $tag" --generate-notes \
            || echo "Release 已由并行任务创建，继续上传。"
          gh release upload "$tag" \
            app/release/GoStudy.exe \
            app/release/GoStudy-linux-amd64 \
            app/release/GoStudy-linux-arm64 \
            --clobber

      - name: 保存为工作流产物
        uses: actions/upload-artifact@v7
        with:
          name: desktop-builds
          path: |
            app/release/GoStudy.exe
            app/release/GoStudy-linux-amd64
            app/release/GoStudy-linux-arm64

  windows-installer:
    name: Windows 安装包
    # Inno Setup 只有 Windows 版，所以这里单独起一个 Windows 运行器；
    # 可执行文件直接取 desktop 任务的产物，保证安装包里的程序和 Release 里那个完全一致。
    needs: desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 取回桌面端产物
        uses: actions/download-artifact@v7
        with:
          name: desktop-builds
          path: app/release

      - name: 准备 Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "运行器上没有 Inno Setup，现装一个。"
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 准备失败：找不到 $iscc"
          }
          # 中文语言文件由仓库自带（发行版不带），这里只需要一个能跑的编译器。
          Write-Host "ISCC：$iscc"
          & $iscc /? | Select-Object -First 1

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${tag}" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            # 手动触发时没有 tag，用占位版本，只验证流水线能跑通。
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译安装包
        shell: bash
        env:
          ISCC: C:/Program Files (x86)/Inno Setup 6/ISCC.exe
        run: bash app/scripts/build-windows-installer.sh --version "${{ steps.version.outputs.value }}"

      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" != "push" || -z "${tag}" ]]; then
            echo "非 tag 触发，跳过 Release 上传，仅保留构建产物。"
            exit 0
          fi
          # 安装包与 desktop 任务的资源名保持一致，落地页按名字直链下载。
          # desktop 与 android 任务并行，理论上这个任务总在它们之后；这里仍然先确认 Release 存在。
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "GoStudy $tag" --generate-notes \
            || echo "Release 已由并行任务创建，继续上传。"
          gh release upload "$tag" app/release/GoStudy-Setup.exe --clobber

      - name: 保存为工作流产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: app/release/GoStudy-Setup.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu 运行器自带 Android SDK；android-actions/setup-android 会尝试安装
      # 早已废弃的 "tools" 包而失败，所以这里直接用自带的 sdkmanager 装所需组件。
      - name: 安装 Android SDK 组件与 NDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(ls -d "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          [[ -x "$sdkmanager" ]] || { echo "未找到 sdkmanager，检查 ANDROID_HOME"; exit 1; }
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.2.12479018" >> "$GITHUB_ENV"
          # 注意：不要用 `yes | sdkmanager`——安装结束时 yes 会收到 SIGPIPE，
          # 在 pipefail 下会让整步失败。printf 写完即退出，不会报 broken pipe。
          printf 'y\n%.0s' {1..200} | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" < /dev/null
          ls "$sdk_root/ndk"

      - name: 安装 gomobile 工具
        run: bash app/scripts/install-mobile-tools.sh

      - name: 准备签名密钥（可选）
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GOSTUDY_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gostudy-release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "已从仓库密钥构建签名用密钥库。"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "未配置 GOSTUDY_KEYSTORE_BASE64，将产出未签名 APK。"
          fi

      - name: 构建 Android 包
        env:
          # ANDROID_HOME / ANDROID_NDK_HOME 由上一步写入 GITHUB_ENV。
          GOSTUDY_KEYSTORE: ${{ steps.signing.outputs.available == 'true' && format('{0}/gostudy-release.jks', runner.temp) || '' }}
          GOSTUDY_KEY_ALIAS: ${{ secrets.GOSTUDY_KEY_ALIAS || 'gostudy' }}
          GOSTUDY_KEY_PASSWORD: ${{ secrets.GOSTUDY_KEY_PASSWORD }}
        run: bash app/scripts/build-android.sh release

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          apk="app/release/GoStudy-release.apk"
          asset="GoStudy-android-release.apk"
          if [[ ! -f "$apk" ]]; then
            apk="app/release/GoStudy-release-unsigned.apk"
            asset="GoStudy-android-release-unsigned.apk"
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "push" || -z "${tag}" ]]; then
            echo "非 tag 触发，跳过 Release 上传，仅保留构建产物。"
            exit 0
          fi
          # 上传用与 README 一致的资源名，避免下载说明与实际文件名不符。
          cp -- "$apk" "app/release/$asset"
          # desktop 任务也在写同一个 Release：谁先跑完谁负责建，建失败说明对方已建好。
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "GoStudy $tag" --generate-notes \
            || echo "Release 已由并行任务创建，继续上传。"
          gh release upload "$tag" "app/release/$asset" --clobber

      - name: 保存为工作流产物
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: |
            app/release/GoStudy-release.apk
            app/release/GoStudy-release-unsigned.apk
          if-no-files-found: ignore

  gitee-mirror:
    name: Gitee 国内镜像
    # 镜像的内容直接取自 GitHub Release，而不是各任务的构建产物：
    # 这样两边发布的东西一定一致，也能单独补发某个历史版本。
    needs: [desktop, windows-installer, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 确定 tag 并检查令牌
        id: setup
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          # 手动触发时可以填 gitee_tag 补发某个已发布的版本
          tag="${{ inputs.gitee_tag || github.ref_name }}"
          if [[ -z "${GITEE_TOKEN}" ]]; then
            echo "::notice ::未配置 GITEE_TOKEN，跳过 Gitee 镜像；开通步骤见 README 的「国内镜像（Gitee）」。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "${tag}" =~ ^v[0-9] ]]; then
            echo "::notice ::${tag} 不是版本 tag，跳过 Gitee 镜像。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 取回 GitHub Release 上的产物
        if: steps.setup.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 不带 --pattern：Release 上的资源本来就是这几个，另有 --archive 才会带源码压缩包
          gh release download "${{ steps.setup.outputs.tag }}" --dir dist --clobber
          ls -la dist

      - name: 发布到 Gitee
        if: steps.setup.outputs.skip == 'false'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          # 仓库名默认 gostudy-release；想换名字就改仓库变量 GITEE_REPO（同时改落地页里的常量）
          bash app/scripts/publish-gitee-release.sh \
            --repo "${{ vars.GITEE_REPO || 'pang-xianshu/gostudy-release' }}" \
            --tag "${{ steps.setup.outputs.tag }}" \
            --dir dist
