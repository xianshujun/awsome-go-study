name: Pages

# 构建 landing/ 并发布到 GitHub Pages。
# 截图在构建后从应用目录复制进产物，保证与应用用的是同一份。
on:
  push:
    branches: [master]
    paths:
      - 'landing/**'
      - 'app/docs/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建落地页
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建
        run: npm run build

      - name: 复制应用截图进产物
        run: |
          set -euo pipefail
          mkdir -p dist/screenshots
          cp ../app/docs/screenshots/*.png dist/screenshots/
          # 少一个关键文件就说明路径写错了
          test -s dist/index.html
          test -s dist/screenshots/03-lesson.png
          test -s dist/screenshots/06-mobile.png
          ls dist

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing/dist

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
