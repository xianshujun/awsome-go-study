plugins {
    id 'com.android.application'
}

android {
    namespace 'io.gostudy.local'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.gostudy.local'
        minSdk 26
        targetSdk 35
        versionCode 35
        versionName '0.7.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // gomobile 的 JNI 使用生成的类名；暂不做混淆以免破坏绑定。
            minifyEnabled false
            debuggable false
        }
    }
}

dependencies {
    implementation files('libs/gostudy.aar')
}
